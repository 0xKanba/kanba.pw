name: Compress Images

on:
  push:
    branches:
      - master
  workflow_dispatch: # زر لتشغيل البوت يدوياً متى أردت

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Compress Images in /images/ only
        run: |
          # التأكد من وجود مجلد images قبل البدء لتجنب الأخطاء
          if [ ! -d "images" ]; then
            echo "مجلد images غير موجود، تخطي الضغط..."
            exit 0
          fi
          
          echo "🖼️ بدء ضغط الصور داخل مجلد images/ فقط..."
          
          # ضغط صور PNG داخل images فقط
          find images -type f -name "*.png" -exec mogrify -quality 85 -strip {} \;
          
          # ضغط صور JPG/JPEG داخل images فقط
          find images -type f -name "*.jpg" -exec mogrify -quality 85 -strip {} \;
          find images -type f -name "*.jpeg" -exec mogrify -quality 85 -strip {} \;
          
          echo "✅ انتهى الضغط!"

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git diff --staged --quiet || git commit -m "🖼️ ضغط صور مجلد images تلقائياً"
          git push
