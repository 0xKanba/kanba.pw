name: Auto Update Project Tree

on:
  push:
    branches:
      - master

jobs:
  update-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tree and update safely
        run: |
          # ⬇️ هذا هو السطر الذي يولد الشجرة، لقد أزلت 'md' من القائمة ليظهر المجلد ⬇️
          tree -I '.git|.github|node_modules' --charset utf-8 > tree.txt
          
          # تجهيز الشجرة الجديدة بين العلامات
          echo '<!-- TREE START -->' > new_tree.txt
          echo '```text' >> new_tree.txt
          cat tree.txt >> new_tree.txt
          echo '```' >> new_tree.txt
          echo '<!-- TREE END -->' >> new_tree.txt
          
          # إذا لم يكن README موجوداً، ننشئه بالعلامات
          if [ ! -f README.md ]; then
            cat new_tree.txt > README.md
          else
            # استخدام perl لاستبدال النص بين العلامات فقط دون المساس بالباقي
            perl -i -0pe 's/<!-- TREE START -->.*?<!-- TREE END -->/`cat new_tree.txt`/smge' README.md
          fi
          
          # تنظيف
          rm -f tree.txt new_tree.txt

      - name: Generate MD files map
        run: |
          if [ -d "md" ]; then
            echo "[" > md/files.json
            ls md/*.md 2>/dev/null | xargs -I {} basename {} .md | awk 'NR>1{printf ","}{printf "\"%s\"", $0}' >> md/files.json
            echo "]" >> md/files.json
          else
            echo "[]" > md/files.json
          fi

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md md/files.json
          git diff --staged --quiet || git commit -m "🔄 تحديث هيكل المشروع وملف الخريطة تلقائياً"
          git push
