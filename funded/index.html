<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prop Rules — Trading Protocol</title>
  <link rel="icon" href="/images/btc.png" type="image/png" />
  <link rel="stylesheet" href="/funded/style.css" />
</head>
<body>

<div id="app">

  <!-- Loading -->
  <div id="loading">Initializing Protocol...</div>

  <!-- Content -->
  <div id="content" class="hidden">

    <!-- Top bar -->
    <div id="topbar">
      <span class="topbar-brand">PropRules · kanba.pw</span>
      <a class="btn-translate"
         href="https://kanba-pw.translate.goog/funded/?_x_tr_sl=en&_x_tr_tl=ar&_x_tr_hl=en-US&_x_tr_pto=wapp"
         target="_blank" rel="noopener">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        عربي ↗
      </a>
    </div>

    <!-- Selector Panel -->
    <div id="selector-panel">

      <div class="selector-row">
        <span class="selector-label">Firm</span>
        <div class="btn-group" id="firm-btns"></div>
      </div>

      <div class="selector-divider"></div>

      <div class="selector-row">
        <span class="selector-label">Market</span>
        <div class="btn-group" id="market-btns"></div>
      </div>

      <div class="selector-divider"></div>

      <div class="selector-row">
        <span class="selector-label">Account</span>
        <div class="btn-group" id="account-btns"></div>
      </div>

    </div>

    <!-- Main -->
    <div id="main-content">

      <!-- Header -->
      <header id="main-header">
        <div class="header-inner">
          <div>
            <div class="header-meta">
              <span class="badge badge-solid">Technical Protocol</span>
              <span class="badge badge-outline" id="protocol-id"></span>
            </div>
            <a id="firm-name" href="#" target="_blank" rel="noopener"></a>
            <p id="firm-sub"></p>
          </div>
          <div id="last-updated"></div>
        </div>
      </header>

      <!-- Dashboard -->
      <div id="dashboard">
        <div id="left-column"></div>
        <div id="right-column"></div>
      </div>

    </div>

  </div><!-- /content -->

  <!-- Footer -->
  <footer id="page-footer">
    <span id="footer-path"></span>
    <span id="footer-copy">© 2026 PropRules · kanba.pw</span>
  </footer>

</div><!-- /app -->

<script src="/funded/script.js"></script>
</body>
</html>
