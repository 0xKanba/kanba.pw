<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Prop firm trading rules — kanba.pw"/>
  <title>PropRules · kanba.pw</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kan.svg" type="image/svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet"/>
  
  <!-- PRO MAX UI for JSON Dashboard -->
  <link rel="stylesheet" href="/funded/style.css"/>
</head>
<body>

<!-- ── APP SHELL ─────────────────────────────────────── -->
<div id="app">

  <!-- THEME TOGGLE -->
  <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme">
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <!-- LOADING -->
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>

  <!-- CONTENT -->
  <main id="content" class="hidden" aria-label="Prop firm rules dashboard">

    <!-- ── HEADER BAR ── -->
    <header id="site-header">
      <div class="header-left">
        <span class="site-logo">PropRules</span>
        <span class="site-sub">kanba.pw</span>
      </div>
      <a id="translate-btn"
         href="https://kanba-pw.translate.goog/funded/?_x_tr_sl=en&_x_tr_tl=ar&_x_tr_hl=en-US&_x_tr_pto=wapp"
         target="_blank" rel="noopener" class="chip chip-outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        AR ↗
      </a>
    </header>

    <!-- ── SELECTOR PANEL ── -->
    <section id="selector" aria-label="Account selector">
      <div class="selector-row" id="row-firm">
        <span class="sel-label">Firm</span>
        <div class="pill-group" id="firm-pills" role="group" aria-label="Select firm"></div>
      </div>
      <div class="selector-divider"></div>
      <div class="selector-row" id="row-market">
        <span class="sel-label">Market</span>
        <div class="pill-group" id="market-pills" role="group" aria-label="Select market"></div>
      </div>
      <div class="selector-divider"></div>
      <div class="selector-row" id="row-account">
        <span class="sel-label">Account</span>
        <div class="pill-group" id="account-pills" role="group" aria-label="Select account"></div>
      </div>
    </section>

    <!-- ── ACCOUNT HEADER ── -->
    <div id="account-header">
      <div class="acct-meta">
        <span class="chip chip-filled">Protocol</span>
        <span class="chip chip-outline" id="proto-id"></span>
      </div>
      <a id="firm-name-link" href="#" target="_blank" rel="noopener" aria-label="Visit firm website"></a>
      <p id="firm-subtitle"></p>
      <p id="last-updated"></p>
    </div>

    <!-- ── DASHBOARD ── -->
    <div id="dashboard">
      <div id="left-col"></div>
      <div id="right-col"></div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer id="site-footer">
    <span id="footer-path"></span>
    <span>© 2026 PropRules · kanba.pw</span>
  </footer>

</div><!-- /app -->

<div id="footer"></div>
<div class="bg-mesh"></div>

<script src="/funded/script.js"></script>
<script src="/js/common.js"></script>
</body>
</html>
