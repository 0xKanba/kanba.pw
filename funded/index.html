<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prop Firm Rules Technical Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/funded/style.css">
      <link rel="icon" href="/images/btc.png" type="image/png">

</head>
<body class="bg-background text-foreground font-sans antialiased selection:bg-foreground selection:text-background min-h-screen">
    <div id="app" class="p-4 sm:p-6 md:p-8 lg:p-12 max-w-7xl mx-auto flex flex-col min-h-screen">
        <!-- Loading State -->
        <div id="loading" class="p-12 font-mono opacity-50">Initializing Protocol...</div>
        
        <!-- App Content (Hidden initially) -->
        <div id="content" class="hidden flex-grow flex flex-col">
            <!-- Navigation -->
            <nav id="nav" class="mb-8 md:mb-12 flex flex-wrap items-center gap-3 md:gap-4 text-[9px] md:text-[10px] font-mono uppercase tracking-widest border border-foreground/10 p-2 md:p-4 bg-foreground/[0.02]">
                <div class="flex items-center gap-2 group">
                    <i data-lucide="globe" class="w-3 h-3 opacity-40"></i>
                    <select id="firm-select" class="bg-transparent border-none focus:ring-0 cursor-pointer hover:opacity-100 opacity-60 transition-opacity outline-none"></select>
                </div>
                
                <i data-lucide="chevron-right" class="w-3 h-3 opacity-20 hidden sm:block"></i>
                
                <div class="flex items-center gap-2">
                    <i data-lucide="database" class="w-3 h-3 opacity-40"></i>
                    <select id="market-select" class="bg-transparent border-none focus:ring-0 cursor-pointer hover:opacity-100 opacity-60 transition-opacity outline-none"></select>
                </div>

                <i data-lucide="chevron-right" class="w-3 h-3 opacity-20 hidden sm:block"></i>

                <div class="flex items-center gap-2">
                    <span class="opacity-40 hidden xs:inline">Account:</span>
                    <select id="account-select" class="bg-transparent border-none focus:ring-0 cursor-pointer font-bold text-foreground outline-none"></select>
                </div>
            </nav>

            <div id="main-content" class="flex-grow flex flex-col">
                <!-- Header -->
                <header class="mb-8 md:mb-12 border-b-2 border-foreground pb-6 md:pb-8">
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                        <div class="space-y-4">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-[9px] md:text-[10px] font-mono uppercase tracking-[0.2em] bg-foreground text-background px-2 py-0.5">
                                    Technical Protocol
                                </span>
                                <span id="protocol-id" class="text-[9px] md:text-[10px] font-mono uppercase tracking-[0.2em] border border-foreground px-2 py-0.5"></span>
                            </div>
                            <h1 id="firm-name" class="text-4xl sm:text-6xl md:text-8xl font-bold tracking-tighter leading-none"></h1>
                            <p id="firm-type-model" class="text-lg md:text-xl font-medium tracking-tight opacity-60"></p>
                        </div>
                        <div id="last-updated" class="text-left md:text-right font-mono text-[9px] md:text-[10px] uppercase tracking-widest opacity-40"></div>
                    </div>
                </header>

                <!-- Dashboard Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-0 border border-foreground/20 flex-grow">
                    <!-- Left Column -->
                    <div id="left-column" class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2"></div>
                    <!-- Right Column -->
                    <div id="right-column" class="lg:col-span-4 border-t lg:border-t-0 lg:border-l border-foreground/10 bg-foreground/[0.02] flex flex-col"></div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-8 md:mt-12 py-4 flex flex-col md:flex-row justify-between items-center gap-4 opacity-20 text-[8px] md:text-[9px] font-mono uppercase tracking-[0.4em] text-center md:text-left">
            <div id="footer-path" class="break-all"></div>
            <div>© 2026 PropRules Technical Division</div>
        </footer>
    </div>

    <script src="/funded/script.js"></script>
</body>
</html>
