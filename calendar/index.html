<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HL-QUANT | تقويم التداول</title>
    <link rel="stylesheet" href="/calendar/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Date Fns -->
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
</head>
<body>
    <div class="bg-glow"></div>
    
    <main class="container">
        <!-- Compact Search Section -->
        <div class="search-wrapper">
            <form id="searchForm" class="search-bar">
                <i data-lucide="wallet" class="icon-wallet"></i>
                <input type="text" id="walletInput" placeholder="أدخل عنوان المحفظة 0x..." autocomplete="off">
                <button type="submit" id="searchBtn">
                    <span id="btnText">تحليل</span>
                    <div id="loader" class="loader hidden"></div>
                </button>
            </form>
        </div>

        <div id="errorMessage" class="error-msg hidden"></div>

        <!-- Dashboard Content -->
        <div id="dashboard" class="dashboard-content hidden">
            
            <!-- Calendar Section (Refined look) -->
            <section class="calendar-section">
                <div class="calendar-title">Calendar</div>
                <div class="calendar-nav">
                    <button id="prevMonth" class="nav-arrow"><i data-lucide="chevron-left"></i></button>
                    <h2 id="currentMonthYear">--</h2>
                    <button id="nextMonth" class="nav-arrow"><i data-lucide="chevron-right"></i></button>
                </div>
                
                <div class="calendar-grid-header">
                    <div>الاثنين</div><div>الثلاثاء</div><div>الأربعاء</div><div>الخميس</div><div>الجمعة</div><div>السبت</div><div>الأحد</div>
                </div>
                <div id="calendarDays" class="calendar-days"></div>
            </section>

            <!-- Compact Stats Grid -->
            <section class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">24h</span>
                    <div class="stat-value" id="stats24h">--</div>
                </div>
                <div class="stat-box">
                    <span class="stat-label">7d</span>
                    <div class="stat-value" id="stats7d">--</div>
                </div>
                <div class="stat-box">
                    <span class="stat-label">30d</span>
                    <div class="stat-value" id="stats30d">--</div>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Total</span>
                    <div class="stat-value" id="statsAll">--</div>
                </div>
            </section>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <i data-lucide="shield-check" size="64"></i>
            <p>بانتظار تحليل البيانات السري...</p>
        </div>
    </main>

    <!-- Daily Details Modal -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header-ref">
                <h3>📜 تاريخ الصفقات</h3>
                <p id="tradeSubtitle">آخر 20 صفقة مكتملة</p>
            </div>
            <div id="dayFills" class="modal-content"></div>
            <div class="modal-footer">
                <button id="closeModal">إغلاق</button>
            </div>
        </div>
    </div>

    <script src="/calendar/script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
