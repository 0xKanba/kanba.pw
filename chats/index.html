<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ديسكورد تشات - Supabase</title>
    <style>
        /* تصميم شبيه بديسكورد */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #36393f; color: #dcddde; display: flex; height: 100vh; justify-content: center; align-items: center; }
        
        /* صفحة تسجيل الدخول */
        .auth-container { background-color: #2f3136; padding: 40px; border-radius: 10px; width: 400px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .auth-container h2 { text-align: center; color: #ffffff; }
        .auth-container input { padding: 12px; border-radius: 5px; border: none; background-color: #40444b; color: #ffffff; font-size: 16px; outline: none; }
        .auth-container button { padding: 12px; border-radius: 5px; border: none; background-color: #5865f2; color: #ffffff; font-weight: bold; cursor: pointer; font-size: 16px; }
        .auth-container button:hover { background-color: #4752c4; }
        .auth-container p { text-align: center; font-size: 14px; color: #96989d; }
        .auth-container a { color: #5865f2; cursor: pointer; text-decoration: none; }
        .auth-container .error-msg { color: #ed4245; font-size: 14px; text-align: center; display: none; }

        /* واجهة الدردشة */
        .chat-wrapper { display: none; width: 100%; height: 100%; } /* مخفية افتراضياً */
        .chat-layout { display: flex; width: 100%; height: 100%; }
        
        .sidebar { width: 240px; background-color: #2f3136; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #4f545c; font-weight: bold; font-size: 18px; }
        .channels { padding: 10px; flex: 1; }
        .channel { padding: 8px; border-radius: 5px; cursor: pointer; margin-bottom: 5px; color: #96989d; }
        .channel:hover, .channel.active { background-color: #40444b; color: #ffffff; }
        .user-info { padding: 16px; border-top: 1px solid #4f545c; display: flex; align-items: center; justify-content: space-between; background-color: #292b2f; }
        .user-info span { color: #ffffff; font-size: 14px; }
        .logout-btn { background: none; border: none; color: #96989d; cursor: pointer; font-size: 16px; }
        .logout-btn:hover { color: #ffffff; }

        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 16px; border-bottom: 1px solid #4f545c; font-weight: bold; background-color: #36393f; }
        
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background-color: #40444b; padding: 10px; border-radius: 8px; max-width: 70%; }
        .message .author { color: #5865f2; font-weight: bold; margin-bottom: 4px; display: block; font-size: 14px; }
        .message .text { color: #dcddde; font-size: 16px; line-height: 1.4; }
        
        .input-area { padding: 16px; background-color: #40444b; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; border-radius: 8px; border: none; background-color: #36393f; color: #ffffff; font-size: 16px; outline: none; }
        .input-area button { padding: 12px 20px; border-radius: 8px; border: none; background-color: #5865f2; color: #ffffff; font-weight: bold; cursor: pointer; font-size: 16px; }
        .input-area button:hover { background-color: #4752c4; }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول / إنشاء الحساب -->
    <div class="auth-container" id="auth-screen">
        <h2 id="auth-title">تسجيل الدخول</h2>
        <div class="error-msg" id="auth-error"></div>
        <input type="email" id="email-input" placeholder="البريد الإلكتروني">
        <input type="password" id="password-input" placeholder="كلمة المرور">
        <button id="auth-btn">دخول</button>
        <p>ليس لديك حساب؟ <a id="toggle-auth">سجل الآن</a></p>
    </div>

    <!-- 2. واجهة الدردشة (مخفية حتى يسجل الدخول) -->
    <div class="chat-wrapper" id="chat-screen">
        <div class="chat-layout">
            <div class="sidebar">
                <div class="sidebar-header">القنوات</div>
                <div class="channels">
                    <div class="channel active"># عام</div>
                </div>
                <div class="user-info">
                    <span id="current-user-email">مستخدم</span>
                    <button class="logout-btn" id="logout-btn">تسجيل الخروج 🚪</button>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-header"># عام</div>
                <div class="messages" id="messages-container"></div>
                <div class="input-area">
                    <input type="text" id="message-input" placeholder="اكتب رسالتك هنا...">
                    <button id="send-btn">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- تحميل مكتبة Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script>
        // ✅ إعدادات الاتصال
        const SUPABASE_URL = 'https://zoifrlxjtggdkwkzfuwt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvaWZybHhqdGdnZGt3a3pmdXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NDc1OTUsImV4cCI6MjA5MjQyMzU5NX0.YXTqd8ulNAo0kODWkVcRKOr9RePS3aOSEXK5mnFoLNg';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // عناصر HTML
        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-btn');
        const toggleAuth = document.getElementById('toggle-auth');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const authError = document.getElementById('auth-error');
        const currentUserEmail = document.getElementById('current-user-email');
        const logoutBtn = document.getElementById('logout-btn');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        let isLogin = true; // لتحديد هل نحن في شاشة دخول أم إنشاء حساب
        let loggedInUser = null; // لتخزين بيانات المستخدم الحالي

        // تبديل بين شاشة الدخول وإنشاء الحساب
        toggleAuth.addEventListener('click', () => {
            isLogin = !isLogin;
            authTitle.innerText = isLogin ? "تسجيل الدخول" : "إنشاء حساب جديد";
            authBtn.innerText = isLogin ? "دخول" : "تسجيل";
            toggleAuth.innerText = isLogin ? "سجل الآن" : "لديك حساب؟ سجل دخول";
            authError.style.display = 'none';
        });

        // تسجيل دخول / إنشاء حساب
        authBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                showError("الرجاء إدخال الإيميل والباسوورد");
                return;
            }

            authBtn.disabled = true;
            authBtn.innerText = "جاري التحقق...";

            try {
                let response;
                if (isLogin) {
                    // تسجيل الدخول
                    response = await supabaseClient.auth.signInWithPassword({ email, password });
                } else {
                    // إنشاء حساب
                    response = await supabaseClient.auth.signUp({ email, password });
                }

                if (response.error) {
                    showError(response.error.message);
                } else {
                    // نجاح! سيتم التقاطه في onAuthStateChange
                }
            } catch (e) {
                showError("حدث خطأ غير متوقع");
            } finally {
                authBtn.disabled = false;
                authBtn.innerText = isLogin ? "دخول" : "تسجيل";
            }
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
        });

        // مراقبة حالة المستخدم (هل سجل الدخول أم لا)
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                // المستخدم سجل الدخول
                loggedInUser = session.user;
                authScreen.style.display = 'none';
                chatScreen.style.display = 'block';
                currentUserEmail.innerText = loggedInUser.email;
                loadMessages(); // تحميل الرسائل
            } else {
                // المستخدم لم يسجل الدخول أو سجل خروجه
                loggedInUser = null;
                authScreen.style.display = 'flex';
                chatScreen.style.display = 'none';
                messagesContainer.innerHTML = '';
            }
        });

        // جلب الرسائل القديمة
        async function loadMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (!error && data) {
                messagesContainer.innerHTML = ''; 
                data.forEach(msg => appendMessage(msg.username, msg.content));
            }
        }

        // الاستماع للرسائل الجديدة لحظياً
        supabaseClient
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                const newMessage = payload.new;
                if (loggedInUser && newMessage.user_id !== loggedInUser.id) {
                    appendMessage(newMessage.username, newMessage.content);
                }
            })
            .subscribe();

        // إرسال رسالة جديدة
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '' || !loggedInUser) return;

            sendBtn.innerText = '...';
            sendBtn.disabled = true;

            try {
                // نستخدم الإيميل كاسم ظاهر (يمكنك تغييره لاحقاً ليكون اسم مستخدم مستعار)
                const username = loggedInUser.email.split('@')[0]; 
                const userId = loggedInUser.id;

                const { error } = await supabaseClient
                    .from('messages')
                    .insert([{ username: username, content: text, user_id: userId }]);

                if (!error) {
                    appendMessage(username, text);
                    messageInput.value = ''; 
                }
            } catch (e) {
                console.error(e);
            } finally {
                sendBtn.innerText = 'إرسال';
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // إضافة الرسالة للشاشة
        function appendMessage(username, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<span class="author">${username}</span><span class="text">${text}</span>`;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // دالة إظهار الخطأ
        function showError(msg) {
            authError.innerText = msg;
            authError.style.display = 'block';
        }
    </script>
</body>
</html>
