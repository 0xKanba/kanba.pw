<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR · Kanba</title>
  <link rel="stylesheet" href="/css/qr.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <div class="qr-bg" aria-hidden="true"><span></span><span></span></div>

  <main class="qr-shell">
    <header class="qr-head">
      <h1>QR</h1>
      <p>Type, paste, or pass <code>?text=</code>. The code updates as you edit.</p>
    </header>

    <div class="qr-layout">
      <section class="panel controls">
        <label>
          Content
          <textarea id="qrInput" placeholder="https://kanba.pw or a wallet address" autocomplete="off" spellcheck="false"></textarea>
        </label>
        <div class="meta">
          <span id="qrCount">0 chars</span>
          <span id="qrStatus" class="status"></span>
        </div>

        <div class="row">
          <label>
            Size
            <select id="qrSize">
              <option value="220">Small</option>
              <option value="320" selected>Medium</option>
              <option value="480">Large</option>
              <option value="720">Print</option>
            </select>
          </label>
          <label>
            Error correction
            <select id="qrLevel">
              <option value="L">Low</option>
              <option value="M" selected>Medium</option>
              <option value="Q">Quartile</option>
              <option value="H">High</option>
            </select>
          </label>
        </div>

        <div class="colors">
          <label class="color-field">Dark
            <input id="qrDark" type="color" value="#111111">
          </label>
          <label class="color-field">Light
            <input id="qrLight" type="color" value="#ffffff">
          </label>
        </div>

        <div class="actions">
          <button type="button" id="qrPaste" class="ghost">Paste</button>
          <button type="button" id="qrCopy" class="ghost" disabled>Copy</button>
          <button type="button" id="qrDownload" disabled>Download PNG</button>
          <button type="button" id="qrClear" class="ghost">Clear</button>
        </div>
      </section>

      <section class="panel stage" aria-live="polite">
        <p id="qrEmpty" class="empty">The code appears here as soon as there is text.</p>
        <div class="card" id="qrcode" hidden></div>
      </section>
    </div>
  </main>

  <div id="footer"></div>
  <script src="/js/common.js" defer></script>
  <script src="/js/qr.js" defer></script>
</body>
</html>
