<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR · Kanba</title>
  <meta name="description" content="Make a QR from text, or read a QR image. Runs in the browser.">
  <meta property="og:title" content="QR · Kanba">
  <meta property="og:description" content="Make a QR from text, or read a QR image. Runs in the browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kanba.pw/qr-generator.html">
  <meta property="og:image" content="https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/favicon/x-bg.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="QR · Kanba">
  <meta name="twitter:description" content="Make a QR from text, or read a QR image. Runs in the browser.">
  <meta name="twitter:image" content="https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/favicon/x-bg.png">
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/favicon/favicon.ico">
  <link rel="stylesheet" href="/css/qr.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
</head>
<body>
  <div class="qr-bg" aria-hidden="true"><span></span><span></span></div>

  <main class="qr-shell" id="app">
    <section class="layer in-layer" id="inLayer">
      <h1>QR</h1>
      <p class="lead">Text becomes a code. A code image becomes text.</p>
      <label>
        Text
        <textarea id="qrInput" placeholder="Link, wallet, or any text" spellcheck="false"></textarea>
      </label>
      <label class="file">
        Or a QR image
        <input id="qrFile" type="file" accept="image/*">
      </label>
      <button type="button" id="go">Create</button>
      <p id="err" class="err" hidden></p>
    </section>

    <section class="layer out-layer" id="outLayer" hidden>
      <div id="qrcode" class="card" hidden></div>
      <pre id="decoded" class="decoded" hidden></pre>
      <div class="out-actions">
        <button type="button" id="copyOut" hidden>Copy</button>
        <button type="button" id="back" class="ghost">Back</button>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <script src="/js/common.js" defer></script>
  <script src="/js/qr.js" defer></script>
</body>
</html>
