name: Auto Update README Tree

# متى يتم التشغيل؟ عند كل رفع على الفرع الرئيسي
on:
  push:
    branches:
      - main # غيّرها إلى master إذا كان هذا هو اسم الفرع لديك

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run md.js Script
        run: node js/md.js

      - name: Commit and Push README.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # تخطي الخطأ في حال لم يكن هناك تغيير جديد في الهيكل
          git commit -m "🤖 Auto-update README structure" || exit 0
          git push
