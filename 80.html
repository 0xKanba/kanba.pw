<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصور</title>
</head>

<body style="margin: 0; background: #000; overflow: hidden;">

  <div style="
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  ">

    <!-- الصورة الأولى: 50% من المساحة -->
    <img
      src="images/Screenshot_2026-10-06_22-33-33.png"
      alt=""
      style="
        width: 100%;
        height: 100%;
        object-fit: cover;
        grid-column: 1 / 3;
      "
    >

    <!-- الصورة الثانية: أسفل يسار -->
    <img
      src="images/Screenshot_20261006-225241.png"
      alt=""
      style="
        width: 100%;
        height: 100%;
        object-fit: cover;
      "
    >

    <!-- الصورة الثالثة: أسفل يمين -->
    <img
      src="images/Screenshot_20261006-225234.png"
      alt=""
      style="
        width: 100%;
        height: 100%;
        object-fit: cover;
      "
    >

  </div>

</body>
</html>
