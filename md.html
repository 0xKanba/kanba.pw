<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* إزالة جميع الهوامش والحدود */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.8;
      color: #222;
      background: #fff;
      font-size: 18px;
      padding: 30px 20px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #eee;
        background: #121212;
      }
      a { color: #4fc3f7; }
      table { border-color: #444; }
      th, td { border-color: #555; }
    }

    #content {
      text-align: initial;
      margin: 0 auto;
    }

    h1, h2, h3, h4, h5, h6 {
      margin: 1.5em 0 1em;
      color: #0074d9;
      text-align: center;
    }

    p, ul, ol, pre {
      margin-bottom: 1em;
    }

    a {
      color: #0056b3;
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin: 15px auto;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px auto;
      text-align: center;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
    }

    th {
      background: #0074d9;
      color: white;
    }

    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.95em;
      text-align: left;
    }

    @media (prefers-color-scheme: dark) {
      code { background: #333; }
      pre { background: #222; }
    }

    /* ⬇️ تنسيق شاشة الخطأ الداكنة الجديدة ⬇️ */
    #error-screen {
      display: none; /* مخفي افتراضياً */
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #1a1a1a; /* خلفية داكنة جداً */
      color: #ffffff; /* نص أبيض */
      display: flex; /* استخدام Flexbox للتوسيط */
      flex-direction: column;
      justify-content: center; /* توسيط عمودي */
      align-items: center; /* توسيط أفقي */
      text-align: center;
      z-index: 9999; /* للتأكد من ظهورها فوق كل شيء */
      font-family: monospace;
    }
    
    #error-screen h1 {
      font-size: 3em;
      color: #ff4d4d; /* أحمر للفت الانتباه */
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
    }
    
    #error-screen p {
      font-size: 1.2em;
      color: #cccccc;
      letter-spacing: 1px;
    }

    #error-screen code {
      background: #333;
      padding: 5px 10px;
      border-radius: 5px;
      color: #4fc3f7;
      border: 1px solid #555;
    }
  </style>
</head>
<body>

  <!-- شاشة الخطأ المخصصة (مخفية افتراضياً) -->
  <div id="error-screen" style="display: none;">
    <h1>404</h1>
    <p>Page not found</p>
    <p style="margin-top: 20px; font-size: 1em;">Change <code>#</code> to a valid file name</p>
  </div>

  <!-- محتوى الـ MD العادي -->
  <div id="content">Loading...</div>

  <script>
    function loadContent() {
      const hash = window.location.hash.substring(1);
      const fileName = hash || '1';
      const filePath = `md/${fileName}.md`;

      const contentDiv = document.getElementById('content');
      const errorScreen = document.getElementById('error-screen');

      // إخفاء شاشة الخطأ وإظهار التحميل عند كل محاولة جديدة
      errorScreen.style.display = 'none';
      contentDiv.style.display = 'block';
      contentDiv.innerHTML = '<p style="text-align:center; color:#888;">Loading...</p>';

      fetch(filePath)
        .then(r => {
          // ⬇️ التعديل السحري هنا: إذا لم يكن الملف موجوداً نعرض شاشة الخطأ فوراً ⬇️
          if (!r.ok) {
            errorScreen.style.display = 'flex'; // إظهار شاشة الخطأ الداكنة
            contentDiv.style.display = 'none';  // إخفاء محتوى التحميل
            throw new Error('Not Found'); // إيقاف باقي الكود لكي لا يقرأ محتوى الخطأ من Cloudflare
          }
          return r.text();
        })
        .then(text => {
          // تحليل النص لتحديد اللغة والاتجاه
          const firstMeaningfulLine = text.trim().split('\n').find(line => line.trim() !== '');
          const hasArabic = /[\u0600-\u06FF]/.test(firstMeaningfulLine || '');

          // تطبيق الاتجاه تلقائيًا
          contentDiv.style.direction = hasArabic ? 'rtl' : 'ltr';
          contentDiv.style.textAlign = hasArabic ? 'right' : 'left';

          // تحويل Markdown إلى HTML
          contentDiv.innerHTML = marked.parse(text);
          document.title = fileName; 
        })
        .catch(e => {
          // الخطأ تم التقاطه بالفعل في الأعلى، هذا مجرد تأمين إضافي
          console.error('Error loading MD:', e);
        });
    }

    // تشغيل الدالة عند فتح الصفحة لأول مرة
    loadContent();

    // تشغيل الدالة مرة أخرى إذا قام المستخدم بتغيير الـ # في الرابط
    window.addEventListener('hashchange', loadContent);
  </script>
</body>
</html>
