<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content</title>
  <link rel="icon" href="/images/btc.png" type="image/png"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: auto !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.8; color: #222; background: #fff;
      font-size: 18px; padding: 30px 20px;
      max-width: 900px; margin: 0 auto; text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #eee; background: #121212; }
      a { color: #4fc3f7; } table { border-color: #444; } th, td { border-color: #555; }
    }
    #content { text-align: initial; margin: 0 auto; direction: auto; }
    h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 1em; color: #0074d9; text-align: center; scroll-margin-top: 20px; }
    p, ul, ol, pre { margin-bottom: 1em; }
    a { color: #0056b3; text-decoration: underline; }
    img { max-width: 100%; border-radius: 8px; margin: 15px auto; display: block; }
    table { width: 100%; border-collapse: collapse; margin: 20px auto; text-align: center; }
    th, td { border: 1px solid #ccc; padding: 10px; }
    th { background: #0074d9; color: white; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 0.95em; text-align: left; }
    @media (prefers-color-scheme: dark) { code { background: #333; } pre { background: #222; } }
    .heading-anchor {
      color: #0074d9; font-size: 0.85em; text-decoration: none;
      margin-inline-start: 8px; vertical-align: middle; cursor: pointer;
      display: inline-block; line-height: 1; opacity: 0.75;
    }
    .heading-anchor:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="content">Loading...</div>
  <script>
    let allowedFiles = [];
    let currentFile = 'us';

    fetch('md/files.json')
      .then(r => r.json())
      .then(files => { allowedFiles = files; loadContent(); })
      .catch(() => document.getElementById('content').innerHTML = '<p style="color:red; text-align:center;">Error loading file map.</p>');

    function loadContent() {
      const rawHash = window.location.hash.substring(1);
      const decoded = decodeURIComponent(rawHash || '');
      const [file, ...headingParts] = decoded.split('#');
      const targetId = headingParts.join('#');
      const contentDiv = document.getElementById('content');

      if (!file || !allowedFiles.includes(file)) {
        window.location.hash = 'us';
        return;
      }

      currentFile = file;
      contentDiv.innerHTML = '<p style="text-align:center; color:#888;">Loading...</p>';

      fetch(`md/${file}.md`)
        .then(r => { if (!r.ok) throw new Error('Not Found'); return r.text(); })
        .then(text => renderMarkdown(text, contentDiv, file, targetId))
        .catch(() => window.location.hash = 'us');
    }

    function renderMarkdown(text, element, file, targetId) {
      element.style.direction = 'auto';
      element.style.textAlign = 'initial';

      const renderer = new marked.Renderer();
      renderer.heading = function(text, level) {
        const id = encodeURIComponent(text.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\u0600-\u06FF\u4e00-\u9fff-]/gi, ''));
        const btn = `<a href="#" class="heading-anchor" data-id="${id}" title="Copy section link">🔗</a>`;
        return `<h${level} id="${id}">${text}${btn}</h${level}>`;
      };

      element.innerHTML = marked.parse(text, { renderer });
      document.title = file;

      element.querySelectorAll('.heading-anchor').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          const id = e.target.dataset.id;
          const url = `${window.location.origin}${window.location.pathname}#${encodeURIComponent(file)}#${id}`;
          navigator.clipboard.writeText(url).then(() => {
            e.target.textContent = '✅';
            setTimeout(() => e.target.textContent = '🔗', 1200);
          }).catch(() => prompt('Copy:', url));
        });
      });

      if (targetId) {
        const el = document.getElementById(targetId);
        if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
      }
    }

    window.addEventListener('hashchange', loadContent);
  </script>
</body>
</html>
