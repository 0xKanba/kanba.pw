<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content</title>
  <link rel="icon" href="/images/btc.png" type="image/png"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.8; color: #222; background: #fff;
      font-size: 18px; padding: 30px 20px;
      max-width: 900px; margin: 0 auto; text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #eee; background: #121212; }
      a { color: #4fc3f7; } table { border-color: #444; } th, td { border-color: #555; }
    }

    #content { 
      text-align: initial; 
      margin: 0 auto; 
      /* ⬇️ السحر هنا: نجعل المحتوى مخفياً افتراضياً ⬇️ */
      opacity: 0; 
      transition: opacity 0.1s ease-in; 
    }

    /* كلاس للإظهار الفوري بعد الجاهزية */
    #content.loaded { 
      opacity: 1; 
    }

    h1, h2, h3, h4, h5, h6 { 
      margin: 1.5em 0 1em; 
      color: #0074d9; 
      text-align: center; 
      position: relative;
      scroll-margin-top: 20px; 
    }

    p, ul, ol, pre { margin-bottom: 1em; }
    a { color: #0056b3; text-decoration: underline; }
    img { max-width: 100%; border-radius: 8px; margin: 15px auto; display: block; }
    
    table { width: 100%; border-collapse: collapse; margin: 20px auto; text-align: center; }
    th, td { border: 1px solid #ccc; padding: 10px; }
    th { background: #0074d9; color: white; }
    
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 0.95em; text-align: left; }

    @media (prefers-color-scheme: dark) {
      code { background: #333; } pre { background: #222; }
    }

    .heading-link {
      position: absolute;
      right: -30px;
      left: auto;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      transition: opacity 0.2s;
      text-decoration: none !important;
      font-size: 0.6em;
      color: #aaa !important;
    }
    [dir="ltr"] .heading-link {
      left: -30px;
      right: auto;
    }
    h1:hover .heading-link {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="content">Loading...</div>

  <script>
    // ⬇️ إيقاف المتصفح من محاولة النزول بمفرده قبلنا ⬇️
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    let allowedFiles = []; 

    fetch('md/files.json')
      .then(r => r.json())
      .then(files => {
        allowedFiles = files; 
        loadContent(); 
      })
      .catch(e => {
        document.getElementById('content').innerHTML = '<p style="color:red; text-align:center;">Error loading file map.</p>';
        document.getElementById('content').classList.add('loaded');
      });

    function loadContent() {
      let hash = window.location.hash.substring(1);
      const contentDiv = document.getElementById('content');

      let fileName = hash.split('/')[0] || 'us';
      let subHeading = hash.includes('/') ? hash.split('/')[1] : null;

      if (!allowedFiles.includes(fileName)) {
        window.location.hash = 'us';
        return;
      }

      const filePath = `md/${fileName}.md`;
      
      // إخفاء المحتوى أثناء التحميل والمعالجة
      contentDiv.classList.remove('loaded'); 
      contentDiv.innerHTML = '<p style="text-align:center; color:#888;">Loading...</p>';

      fetch(filePath)
        .then(r => {
          if (!r.ok) throw new Error('Not Found');
          return r.text();
        })
        .then(text => {
          renderMarkdown(text, contentDiv, fileName);
          
          // ⬇️ الخطوات السحرية للنزول بدون تأثير ⬇️
          if (subHeading) {
            const target = document.getElementById(subHeading);
            if (target) {
              // 1. القفز الفوري للمكان بدون أن يرى المستخدم شيئاً (لأن opacity = 0)
              window.scrollTo(0, target.offsetTop - 20); 
            }
          } else {
            // إذا لم يكن هناك عنوان فرعي، نتأكد أننا في الأعلى
            window.scrollTo(0, 0);
          }
          
          // 2. بعد أن أصبحنا في المكان الصحيح، نُظهر الصفحة فوراً!
          contentDiv.classList.add('loaded');
        })
        .catch(e => {
          window.location.hash = 'us';
        });
    }

    function renderMarkdown(text, element, fileName) {
      const firstMeaningfulLine = text.trim().split('\n').find(line => line.trim() !== '');
      const hasArabic = /[\u0600-\u06FF]/.test(firstMeaningfulLine || '');

      element.style.direction = hasArabic ? 'rtl' : 'ltr';
      element.style.textAlign = hasArabic ? 'right' : 'left';

      const renderer = new marked.Renderer();
      
      renderer.heading = function(data) {
        const text = data.text;
        const level = data.depth;
        
        const id = text.toLowerCase()
                       .replace(/[^\w\u0600-\u06FF\s-]/g, '')
                       .replace(/\s+/g, '-');

        if (level === 1) {
          const headingLink = `${fileName}/${id}`;
          return `<h1 id="${id}">${text}<a class="heading-link" href="#${headingLink}" title="Copy link">🔗</a></h1>`;
        }
        
        return `<h${level} id="${id}">${text}</h${level}>`;
      };

      element.innerHTML = marked.parse(text, { renderer });
      document.title = fileName; 
    }

    window.addEventListener('hashchange', loadContent);
  </script>
</body>
</html>
