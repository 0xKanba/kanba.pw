<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content</title>
  <link rel="icon" href="/images/btc.png" type="image/png"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.8; color: #222; background: #fff;
      font-size: 18px; padding: 30px 20px;
      max-width: 900px; margin: 0 auto; text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #eee; background: #121212; }
      a { color: #4fc3f7; } table { border-color: #444; } th, td { border-color: #555; }
    }
    #content { text-align: initial; margin: 0 auto; }
    h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 1em; color: #0074d9; text-align: center; }
    p, ul, ol, pre { margin-bottom: 1em; }
    a { color: #0056b3; text-decoration: underline; }
    img { max-width: 100%; border-radius: 8px; margin: 15px auto; display: block; }
    table { width: 100%; border-collapse: collapse; margin: 20px auto; text-align: center; }
    th, td { border: 1px solid #ccc; padding: 10px; }
    th { background: #0074d9; color: white; }
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 0.95em; text-align: left; }
    @media (prefers-color-scheme: dark) { code, pre { background: #222; } }

    /* زر النسخ: دائم الظهور، صغير، متجاوب مع الاتجاه */
    .copy-btn {
      font-size: 11px; padding: 2px 6px; margin-left: 8px;
      background: #f0f0f0; border: 1px solid #bbb; border-radius: 4px;
      cursor: pointer; color: #444; vertical-align: middle;
      font-family: inherit; line-height: 1; transition: none;
    }
    .copy-btn:hover { background: #e0e0e0; }
    .copy-btn:active { background: #d0d0d0; }
    [dir="rtl"] .copy-btn { margin-left: 0; margin-right: 8px; }
    @media (prefers-color-scheme: dark) {
      .copy-btn { background: #333; border-color: #555; color: #ccc; }
      .copy-btn:hover { background: #444; }
    }
  </style>
</head>
<body>
  <div id="content">جاري التحميل...</div>
  <script>
    let allowedFiles = ['us'];
    const slugify = t => t.trim().replace(/[^\w\u0600-\u06FF\s-]/g, '').replace(/\s+/g, '-').toLowerCase();

    marked.setOptions({ gfm: true, breaks: true, headerIds: false });

    fetch('md/files.json')
      .then(r => r.json())
      .then(f => { allowedFiles = f; load(); })
      .catch(() => load());

    function load() {
      const hash = window.location.hash.slice(1) || 'us';
      const [file, target] = hash.includes('/') ? hash.split('/') : [hash, null];
      const content = document.getElementById('content');

      if (!allowedFiles.includes(file)) {
        window.location.hash = 'us';
        return;
      }

      content.innerHTML = '<p style="text-align:center;color:#888;">جاري التحميل...</p>';
      fetch(`md/${file}.md`)
        .then(r => r.text())
        .then(text => render(text, content, file, target))
        .catch(() => window.location.hash = 'us');
    }

    function render(text, el, file, target) {
      const isAr = /[\u0600-\u06FF]/.test(text.trim().split('\n').find(l => l.trim()) || '');
      el.style.direction = isAr ? 'rtl' : 'ltr';
      el.style.textAlign = isAr ? 'right' : 'left';

      const r = new marked.Renderer();
      r.heading = (data) => {
        const id = slugify(data.text);
        if (data.depth === 1) {
          return `<h1 id="${id}">${data.text}<button class="copy-btn" data-href="#${file}/${id}">نسخ</button></h1>`;
        }
        return `<h${data.depth} id="${id}">${data.text}</h${data.depth}>`;
      };

      el.innerHTML = marked.parse(text, { renderer: r });
      document.title = file;

      // تمرير لحظي بدون تأثيرات
      if (target) {
        const node = document.getElementById(target);
        if (node) node.scrollIntoView();
      }

      // تفعيل أزرار النسخ
      el.querySelectorAll('.copy-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.preventDefault();
          const url = `${location.origin}${location.pathname}${btn.dataset.href}`;
          const copy = () => {
            btn.textContent = '✓';
            setTimeout(() => btn.textContent = 'نسخ', 1200);
          };
          navigator.clipboard.writeText(url).then(copy).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            copy();
          });
        };
      });
    }

    window.addEventListener('hashchange', load);
  </script>
</body>
</html>
