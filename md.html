<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>md - viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* إزالة جميع الهوامش والحدود */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.8;
      color: #222;
      background: #fff;
      font-size: 18px;
      padding: 30px 20px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #eee;
        background: #121212;
      }
      a { color: #4fc3f7; }
      table { border-color: #444; }
      th, td { border-color: #555; }
    }

    #content {
      text-align: initial;
      margin: 0 auto;
    }

    h1, h2, h3, h4, h5, h6 {
      margin: 1.5em 0 1em;
      color: #0074d9;
      text-align: center;
    }

    p, ul, ol, pre {
      margin-bottom: 1em;
    }

    a {
      color: #0056b3;
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin: 15px auto;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px auto;
      text-align: center;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
    }

    th {
      background: #0074d9;
      color: white;
    }

    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.95em;
      text-align: left;
    }

    @media (prefers-color-scheme: dark) {
      code { background: #333; }
      pre { background: #222; }
    }
  </style>
</head>
<body>
  <div id="content">Loading...</div>

  <script>
    function loadContent() {
      // 1. قراءة ما بعد علامة # (مثال: #tst)
      const hash = window.location.hash.substring(1); 
      
      // 2. إذا لم يكن هناك اسم ملف، نستخدم 1 كافتراضي
      const fileName = hash || '1'; 
      
      // 3. بناء المسار: نضيف .md تلقائياً ونحدد مجلد md
      const filePath = `md/${fileName}.md`;
      const contentDiv = document.getElementById('content');

      fetch(filePath)
        .then(r => {
          if (!r.ok) throw new Error('File not found');
          return r.text();
        })
        .then(text => {
          // تحليل النص لتحديد اللغة والاتجاه
          const firstMeaningfulLine = text.trim().split('\n').find(line => line.trim() !== '');
          const hasArabic = /[\u0600-\u06FF]/.test(firstMeaningfulLine || '');

          // تطبيق الاتجاه تلقائيًا
          contentDiv.style.direction = hasArabic ? 'rtl' : 'ltr';
          contentDiv.style.textAlign = hasArabic ? 'right' : 'left';

          // تحويل Markdown إلى HTML
          contentDiv.innerHTML = marked.parse(text);
          
          // تحديث عنوان التاب في المتصفح
          document.title = fileName; 
        })
        .catch(e => {
          contentDiv.innerHTML = `<p style="color:red; text-align:center;">الملف ${filePath} غير موجود.</p>`;
        });
    }

    // تشغيل الدالة عند فتح الصفحة لأول مرة
    loadContent();

    // تشغيل الدالة مرة أخرى إذا قام المستخدم بتغيير الـ # في الرابط
    window.addEventListener('hashchange', loadContent);
  </script>
</body>
</html>
