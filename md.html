<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* إزالة جميع الهوامش والحدود */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.8;
      color: #222;
      background: #fff;
      font-size: 18px;
      padding: 30px 20px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center; /* توسيط نص افتراضي */
    }

    /* الوضع الداكن حسب إعدادات الجهاز */
    @media (prefers-color-scheme: dark) {
      body {
        color: #eee;
        background: #121212;
      }
      a { color: #4fc3f7; }
      table { border-color: #444; }
      th, td { border-color: #555; }
    }

    /* توسيط المحتوى فقط */
    #content {
      text-align: initial; /* يعود للنص الطبيعي (ليس مركّزًا) بعد التحليل */
      margin: 0 auto;
    }

    /* تنسيق عام للمحتوى */
    h1, h2, h3, h4, h5, h6 {
      margin: 1.5em 0 1em;
      color: #0074d9;
      text-align: center;
    }

    p, ul, ol, pre {
      margin-bottom: 1em;
    }

    a {
      color: #0056b3;
      text-decoration: underline;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin: 15px auto;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px auto;
      text-align: center;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
    }

    th {
      background: #0074d9;
      color: white;
    }

    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.95em;
      text-align: left;
    }

    @media (prefers-color-scheme: dark) {
      code { background: #333; }
      pre { background: #222; }
    }
  </style>
</head>
<body>
  <div id="content">Loading...</div>

  <script>
    fetch('README.md')
      .then(r => r.text())
      .then(text => {
        const contentDiv = document.getElementById('content');

        // تحليل النص لتحديد اللغة والاتجاه
        const firstMeaningfulLine = text.trim().split('\n').find(line => line.trim() !== '');
        const hasArabic = /[\u0600-\u06FF]/.test(firstMeaningfulLine || '');

        // تطبيق الاتجاه تلقائيًا فقط على المحتوى، بدون تغيير الصفحة ككل
        contentDiv.style.direction = hasArabic ? 'rtl' : 'ltr';
        contentDiv.style.textAlign = hasArabic ? 'right' : 'left';

        // تحويل Markdown إلى HTML
        contentDiv.innerHTML = marked.parse(text);
      })
      .catch(e => {
        document.getElementById('content').innerHTML = '<p style="color:#888">Failed to load content.</p>';
      });
  </script>
</body>
</html>
