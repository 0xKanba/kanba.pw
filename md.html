<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Viewer</title>
  <link rel="icon" href="/images/btc.png" type="image/png" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: auto !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.7; color: #24292f; background: #fff;
      font-size: 16px; padding: 24px 16px; max-width: 900px; margin: 0 auto;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #c9d1d9; background: #0d1117; }
      a { color: #58a6ff; }
      table { border-color: #30363d; }
      th, td { border-color: #30363d; }
      th { background: #161b22; color: #c9d1d9; }
      code, pre { background: #161b22; }
    }
    #content { direction: auto; text-align: start; }
    h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 0.5em; scroll-margin-top: 20px; }
    p, ul, ol, pre, blockquote { margin-bottom: 1em; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; border-radius: 6px; margin: 10px auto; display: block; }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { border: 1px solid #d0d7de; padding: 8px 12px; }
    th { background: #f6f8fa; font-weight: 600; }
    code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.9em; text-align: start; }
    .anchor {
      color: #0969da; font-size: 0.85em; margin-inline-start: 8px;
      text-decoration: none; cursor: pointer; opacity: 0.7; vertical-align: middle;
      display: inline-block; line-height: 1;
    }
    .anchor:hover { opacity: 1; }
    .error { color: #cf222e; text-align: center; margin: 40px 0; font-size: 1.1em; }
  </style>
</head>
<body>
  <div id="content"><p style="text-align:center; color:#6e7781; padding-top:40px;">Loading...</p></div>
  <script>
    const DEFAULT = 'us';
    let files = [], ready = false, busy = false;

    // GitHub-style ID generator (supports all languages)
    const toId = t => t.trim().toLowerCase()
      .replace(/[^\w\s\u0600-\u06FF\u4e00-\u9fff\u0400-\u04FF\u00C0-\u024F-]/g, '')
      .replace(/\s+/g, '-');

    // Silent hash update (no hashchange loop)
    const setHash = (f, h = '') => {
      const val = h ? `${f}#${h}` : f;
      history.replaceState(null, '', '#' + encodeURIComponent(val));
    };

    // Parse hash: #file#heading → {file, heading}
    const parseHash = () => {
      const raw = decodeURIComponent(location.hash.slice(1) || DEFAULT);
      const [file, ...rest] = raw.split('#');
      return { file: file || DEFAULT, heading: rest.join('#') || null };
    };

    // Render markdown + attach anchors + instant scroll
    const render = (md, file, target) => {
      const el = document.getElementById('content');
      el.style.direction = 'auto'; el.style.textAlign = 'start';

      const renderer = new marked.Renderer();
      renderer.heading = (txt, lvl) => {
        const id = toId(txt);
        return `<h${lvl} id="${id}">${txt}<a href="#" class="anchor" data-id="${id}" title="Copy link">🔗</a></h${lvl}>`;
      };

      el.innerHTML = marked.parse(md, { renderer });
      document.title = `${file} • MD`;

      // Anchor click → copy deep link
      el.querySelectorAll('.anchor').forEach(a => {
        a.onclick = e => {
          e.preventDefault();
          const id = e.target.dataset.id;
          const url = `${location.origin}${location.pathname}#${file}#${encodeURIComponent(id)}`;
          navigator.clipboard.writeText(url).then(() => {
            e.target.textContent = '✅';
            setTimeout(() => e.target.textContent = '🔗', 1000);
          }).catch(() => prompt('Copy:', url));
        };
      });

      // Instant scroll: target → first heading → top
      const tid = target || [...el.querySelectorAll('h1,h2,h3,h4,h5,h6')][0]?.id;
      if (tid) {
        const node = document.getElementById(tid);
        if (node) node.scrollIntoView({ behavior: 'auto', block: 'start' });
      }
    };

    // Load file with retry logic for Cloudflare Pages path quirks
    const load = async () => {
      if (busy || !ready) return;
      busy = true;

      const { file, heading } = parseHash();
      const el = document.getElementById('content');

      if (!files.includes(file)) { setHash(DEFAULT); return load(); }

      el.innerHTML = '<p style="text-align:center;color:#6e7781;padding-top:40px">Loading...</p>';

      // Try relative then root-relative path (Cloudflare Pages compatibility)
      const paths = [`./md/${file}.md`, `/md/${file}.md`, `md/${file}.md`];
      let text, err;

      for (const p of paths) {
        try {
          const r = await fetch(p);
          if (r.ok) { text = await r.text(); break; }
          err = `HTTP ${r.status}`;
        } catch (e) { err = e.message; }
      }

      if (text) {
        render(text, file, heading);
      } else {
        el.innerHTML = `<div class="error">❌ ${file}.md not found<br><small style="color:#666">${err}</small></div>`;
        setHash(DEFAULT);
      }
      busy = false;
    };

    // Init
    fetch('./md/files.json')
      .then(r => r.json())
      .then(list => { files = Array.isArray(list) ? list : [DEFAULT]; ready = true; load(); })
      .catch(() => {
        document.getElementById('content').innerHTML = '<div class="error">⚠️ files.json missing</div>';
      });

    addEventListener('hashchange', () => { if (ready) load(); });
  </script>
</body>
</html>
