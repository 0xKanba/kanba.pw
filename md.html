<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Viewer</title>
  <link rel="icon" href="/images/btc.png" type="image/png" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: auto !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.7; color: #24292f; background: #ffffff;
      font-size: 16px; padding: 20px; max-width: 900px; margin: 0 auto;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #c9d1d9; background: #0d1117; }
      a { color: #58a6ff; }
      table { border-color: #30363d; }
      th, td { border-color: #30363d; }
      th { background: #161b22; color: #c9d1d9; }
      code, pre { background: #161b22; }
    }
    #content { direction: auto; text-align: left; }
    h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 0.5em; scroll-margin-top: 20px; }
    p, ul, ol, pre, blockquote { margin-bottom: 1em; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; border-radius: 6px; margin: 10px 0; display: block; }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { border: 1px solid #d0d7de; padding: 8px 12px; }
    th { background: #f6f8fa; font-weight: 600; }
    code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.9em; }
    .anchor-link {
      color: #0969da; font-size: 0.8em; margin-left: 8px; text-decoration: none;
      vertical-align: middle; cursor: pointer; opacity: 0.7;
    }
    .anchor-link:hover { opacity: 1; }
    .error { color: #cf222e; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="content"><p style="text-align:center; color:#6e7781;">Loading...</p></div>
  <script>
    let allowedFiles = [];
    let isLoading = false;
    let isReady = false;

    function generateGitHubId(text) {
      return text.trim().toLowerCase()
        .replace(/[^\w\s\u0600-\u06FF\u4e00-\u9fff-]/g, '')
        .replace(/\s+/g, '-');
    }

    function renderMarkdown(mdText, container, file, targetId) {
      container.style.direction = 'auto';
      container.style.textAlign = 'left';

      const renderer = new marked.Renderer();
      renderer.heading = (text, level) => {
        const id = generateGitHubId(text);
        const btn = `<a href="#" class="anchor-link" data-id="${id}" title="Copy link">🔗</a>`;
        return `<h${level} id="${id}">${text}${btn}</h${level}>`;
      };

      container.innerHTML = marked.parse(mdText, { renderer });
      document.title = `${file} - MD Viewer`;

      container.querySelectorAll('.anchor-link').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const id = e.target.dataset.id;
          const url = `${window.location.origin}${window.location.pathname}#${file}#${encodeURIComponent(id)}`;
          navigator.clipboard.writeText(url).then(() => {
            e.target.textContent = '✅';
            setTimeout(() => e.target.textContent = '🔗', 1200);
          }).catch(() => prompt('Copy:', url));
        });
      });

      if (targetId) {
        const el = document.getElementById(targetId);
        if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
      }
    }

    function loadContent() {
      if (isLoading) return;
      isLoading = true;

      const hash = window.location.hash.replace(/^#/, '') || 'us';
      const parts = hash.split('#');
      const file = parts[0] || 'us';
      const targetId = parts.length > 1 ? decodeURIComponent(parts.slice(1).join('#')) : '';

      const container = document.getElementById('content');

      if (!allowedFiles.includes(file)) {
        window.location.hash = 'us';
        isLoading = false;
        return;
      }

      container.innerHTML = '<p style="text-align:center; color:#6e7781;">Loading...</p>';

      fetch(`md/${file}.md`)
        .then(res => { if (!res.ok) throw new Error('404'); return res.text(); })
        .then(text => renderMarkdown(text, container, file, targetId))
        .catch(err => {
          container.innerHTML = `<div class="error">Failed to load: ${file}.md</div>`;
          window.location.hash = 'us';
        })
        .finally(() => isLoading = false);
    }

    // Initialize
    fetch('md/files.json')
      .then(r => r.json())
      .then(files => {
        allowedFiles = Array.isArray(files) ? files : [];
        isReady = true;
        loadContent();
      })
      .catch(() => {
        document.getElementById('content').innerHTML = '<div class="error">Failed to load files.json</div>';
      });

    window.addEventListener('hashchange', () => { if (isReady) loadContent(); });
  </script>
</body>
</html>
