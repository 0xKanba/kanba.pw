<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Content</title>
  <link rel="icon" href="/images/btc.png" type="image/png"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      line-height: 1.8; color: #222; background: #fff;
      font-size: 18px; padding: 30px 20px;
      max-width: 900px; margin: 0 auto; text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #eee; background: #121212; }
      a { color: #4fc3f7; } table { border-color: #444; } th, td { border-color: #555; }
    }

    #content { text-align: initial; margin: 0 auto; }

    h1, h2, h3, h4, h5, h6 { margin: 1.5em 0 1em; color: #0074d9; text-align: center; }
    p, ul, ol, pre { margin-bottom: 1em; }
    a { color: #0056b3; text-decoration: underline; }
    img { max-width: 100%; border-radius: 8px; margin: 15px auto; display: block; }
    
    table { width: 100%; border-collapse: collapse; margin: 20px auto; text-align: center; }
    th, td { border: 1px solid #ccc; padding: 10px; }
    th { background: #0074d9; color: white; }
    
    code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 0.95em; text-align: left; }

    @media (prefers-color-scheme: dark) {
      code { background: #333; } pre { background: #222; }
    }
  </style>
</head>
<body>

  <div id="content">Loading...</div>

  <script>
    let allowedFiles = []; // هنا سنخزن أسماء الملفات الصحيحة

    // 1. جلب خريطة الملفات من ملف files.json الذي صنعه البوت
    fetch('md/files.json')
      .then(r => r.json())
      .then(files => {
        allowedFiles = files; // حفظ القائمة
        loadContent(); // الآن ابدأ بتحميل المحتوى
      })
      .catch(e => {
        // إذا فشل تحميل الخريطة، نعرض رسالة خطأ
        document.getElementById('content').innerHTML = '<p style="color:red; text-align:center;">Error loading file map.</p>';
      });

    function loadContent() {
      let hash = window.location.hash.substring(1);
      const contentDiv = document.getElementById('content');

      // إذا كان الرابط فارغاً، حوله إلى readme
      if (!hash) {
        window.location.hash = 'readme';
        return;
      }

      // ⬇️ السحر هنا ⬇️
      // إذا كان الملف غير موجود في القائمة التي جلبناها من البوت، انقل المستخدم فوراً لـ readme
      if (!allowedFiles.includes(hash)) {
        window.location.hash = 'readme';
        return;
      }

      // إذا كان الملف موجوداً في القائمة، قم بجلبه وعرضه بأمان تام
      const filePath = `md/${hash}.md`;
      contentDiv.innerHTML = '<p style="text-align:center; color:#888;">Loading...</p>';

      fetch(filePath)
        .then(r => {
          if (!r.ok) throw new Error('Not Found');
          return r.text();
        })
        .then(text => {
          renderMarkdown(text, contentDiv, hash);
        })
        .catch(e => {
          // احتياط أمان إضافي
          window.location.hash = 'readme';
        });
    }

    function renderMarkdown(text, element, title) {
      const firstMeaningfulLine = text.trim().split('\n').find(line => line.trim() !== '');
      const hasArabic = /[\u0600-\u06FF]/.test(firstMeaningfulLine || '');

      element.style.direction = hasArabic ? 'rtl' : 'ltr';
      element.style.textAlign = hasArabic ? 'right' : 'left';

      element.innerHTML = marked.parse(text);
      document.title = title; 
    }

    // الاستماع لتغيير الهاش
    window.addEventListener('hashchange', loadContent);
  </script>
</body>
</html>
