<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض صورة</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden; /* منع التمرير الخارجي العشوائي */
    }

    /* حاوية التمرير الرئيسية */
    .feed {
      width: 100vw;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* إخفاء شريط التمرير */
      -ms-overflow-style: none;
    }
    
    .feed::-webkit-scrollbar {
      display: none;
    }

    /* بنية الشريحة الواحدة */
    .slide {
      width: 100vw;
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    /* إعدادات الصورة الأساسية (التحميل التدريجي) */
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* عرض الصورة بالكامل دون قص */
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: opacity, transform;
    }

    /* الصورة بعد اكتمال تحميلها */
    .slide.loaded img {
      opacity: 0.3; /* خافتة قليلاً إذا لم تكن في المركز */
    }

    /* الصورة النشطة حالياً أمام المستخدم */
    .slide.active.loaded img {
      opacity: 1;
      transform: scale(1);
    }

    /* وضع ملء الشاشة عند النقر */
    .slide.fullscreen img {
      object-fit: cover; /* ملء الشاشة بالكامل (مع قص الحواف) */
    }
  </style>
</head>
<body>

  <div class="feed" id="feed"></div>

  <script>
    // مصفوفة الصور
    const images = [
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260710-211451.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260725-222735.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260731-173529.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260813-131008.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260813-142514.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260815-174613.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260819-214803.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260819-232731.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260823-213337.png",
      "https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kanba.pw/Screenshot_20260901-214101.png"
    ];

    const feed = document.getElementById('feed');

    // 1. مراقب التركيز: يُفعل الصورة عندما تصبح في منتصف الشاشة
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        } else {
          entry.target.classList.remove('active');
          // إغلاق وضع ملء الشاشة تلقائياً عند التمرير لشريحة أخرى
          entry.target.classList.remove('fullscreen');
        }
      });
    }, { root: feed, threshold: 0.6 });

    // 2. بناء الشرائح ديناميكياً
    const fragment = document.createDocumentFragment();
    
    images.forEach(src => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      
      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy'; // تفويض المتصفح بمهمة التحميل الكسول
      
      // تفاعل التحميل التدريجي
      img.onload = () => slide.classList.add('loaded');
      
      // تفاعل النقر (ملء الشاشة / تراجع)
      slide.onclick = () => slide.classList.toggle('fullscreen');

      slide.appendChild(img);
      fragment.appendChild(slide);
      observer.observe(slide); // ربط الشريحة بالمراقب
    });

    feed.appendChild(fragment);
  </script>

</body>
</html>
