<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VIDEO🚀</title>
 <link rel="icon" href="https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kan.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }
  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }
</style>
</head>
<body>
  <iframe
    id="videoFrame"
    src="https://player.vimeo.com/video/1216843029?badge=0&amp;autopause=0&amp;loop=1&amp;autoplay=1&amp;muted=1&amp;player_id=0&amp;app_id=58479"
    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    title="BAN KAI"
  ></iframe>
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    const iframe = document.getElementById('videoFrame');
    const player = new Vimeo.Player(iframe, {
      loop: true,
      autoplay: true,
      muted: true
    });

    player.setLoop(true).catch(() => {});
    player.setMuted(true).catch(() => {});
    player.play().catch(() => {});
  </script>
</body>
</html>
