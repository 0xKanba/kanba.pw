<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>صفقة خبر 02 اكتوبر 2026</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/0xKanba/assets@master/kan.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #player-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  
  #custom-play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 40px;
    font-size: 24px;
    font-weight: bold;
    background-color: rgba(255, 0, 0, 0.8);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.3s;
  }
  #custom-play-btn:hover { background-color: rgba(255, 0, 0, 1); }
</style>
</head>
<body>

  <div id="player-container">
    <div id="youtube-player"></div>
    <button id="custom-play-btn">▶ تشغيل الفيديو</button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: 'GEAELbO8rx0',
        playerVars: {
          'autoplay': 0, 
          'rel': 0, 
          'modestbranding': 1,
          'loop': 1, 
          'playlist': 'GEAELbO8rx0',
          'controls': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // تعيين الجودة إلى 1080p عند الجاهزية
    function onPlayerReady(event) {
      if (typeof player.setPlaybackQuality === 'function') {
        player.setPlaybackQuality('hd1080');
      }
    }

    // تأكيد تعيين الجودة عند بدء التشغيل الفعلي
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (typeof player.setPlaybackQuality === 'function') {
          player.setPlaybackQuality('hd1080');
        }
      }
    }

    // تفعيل ملء الشاشة والتشغيل عند النقر
    document.getElementById('custom-play-btn').addEventListener('click', function() {
      const container = document.getElementById('player-container');
      
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else if (container.msRequestFullscreen) {
        container.msRequestFullscreen();
      }

      player.playVideo();
      this.style.display = 'none';
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        player.pauseVideo();
        document.getElementById('custom-play-btn').style.display = 'block';
      }
    });
  </script>

</body>
</html>
